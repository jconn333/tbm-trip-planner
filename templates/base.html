<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}TBM Trip Planner{% endblock %}</title>

    <!-- Tailwind (no build step, great for fast local iteration) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      html, body { height: 100%; }
    </style>
  </head>

  <body class="min-h-full bg-slate-950 text-slate-100">
    <!-- Top bar -->
    <header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur">
      <div class="mx-auto max-w-5xl px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-slate-800 flex items-center justify-center font-bold">
            TBM
          </div>
          <div>
            <div class="text-lg font-semibold leading-tight">TBM Trip Planner</div>
            <div class="text-xs text-slate-400">Planning estimates for partner trips</div>
          </div>
        </div>
        <div class="text-xs text-slate-400">
          Not for operational flight planning
        </div>
      </div>
    </header>

    <!-- Page container -->
    <main class="mx-auto max-w-5xl px-4 py-10">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mx-auto max-w-5xl px-4 pb-10 text-xs text-slate-500">
      <div class="border-t border-slate-800 pt-6">
        Estimates use great-circle distance and winds aloft. Always verify with official flight planning tools.
      </div>
    </footer>
  </body>
</html>
